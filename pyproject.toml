[project]
name = "dataclaw"
version = "0.1.0"
description = "Local-first, open-foundation data science agent platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.13",
    "httpx>=0.28",
    "pyyaml>=6.0",
    "openai>=3.39",
    "langgraph>=1.2",
    "langchain-core>=1.7",
    "langchain-anthropic>=1.7",
    "langchain-openai>=1.7",
    "langchain-google-genai>=4.4",
    "ag-ui-protocol>=0.1",
    "dataclaw-workspace",
    "dataclaw-data",
    "dataclaw-plans",
    "dataclaw-eda",
    "dataclaw-analysis-review",
    "dataclaw-artifacts",
    "dataclaw-notebooks",
    "dataclaw-projects",
    "dataclaw-browser",
    "dataclaw-openclaw",
    "dataclaw-hermes",
    "dataclaw-custom-tools",
    "dataclaw-kaggle",
    "dataclaw-gbrain",
    "dataclaw-codex",
]

[tool.uv]
# Every browser-use release pins google-genai==1.65.0 (and google-auth==2.48.0),
# which conflicts with langchain-google-genai>=4.4. That version needs
# google-genai>=2.20, and google-genai 2.20 needs google-auth>=2.56.
# langchain-google-genai 4.4.1 is the first release that treats gemini-4-* as
# Gemini 3+. google-genai 2.0 only broke the Interactions API, and browser-use's
# ChatGoogle calls only models.generate_content, so lifting both pins within
# their current majors is safe. Drop this once browser-use relaxes the pins.
override-dependencies = ["google-genai>=2.20,<3", "google-auth>=2.56,<3"]

[tool.uv.sources]
dataclaw-workspace = { path = "plugins/dataclaw-workspace", editable = true }
dataclaw-data = { path = "plugins/dataclaw-data", editable = true }
dataclaw-plans = { path = "plugins/dataclaw-plans", editable = true }
dataclaw-eda = { path = "plugins/dataclaw-eda", editable = true }
dataclaw-analysis-review = { path = "plugins/dataclaw-analysis-review", editable = true }
dataclaw-artifacts = { path = "plugins/dataclaw-artifacts", editable = true }
dataclaw-notebooks = { path = "plugins/dataclaw-notebooks", editable = true }
dataclaw-projects = { path = "plugins/dataclaw-projects", editable = true }
dataclaw-browser = { path = "plugins/dataclaw-browser", editable = true }
dataclaw-openclaw = { path = "plugins/dataclaw-openclaw", editable = true }
dataclaw-hermes = { path = "plugins/dataclaw-hermes", editable = true }
dataclaw-custom-tools = { path = "plugins/dataclaw-custom-tools", editable = true }
dataclaw-kaggle = { path = "plugins/dataclaw-kaggle", editable = true }
dataclaw-gbrain = { path = "plugins/dataclaw-gbrain", editable = true }
dataclaw-codex = { path = "plugins/dataclaw-codex", editable = true }

[project.scripts]
dataclaw = "dataclaw.__main__:main"

[project.optional-dependencies]
rag = [
    "sentence-transformers>=3.0",
    "sqlite-vec>=0.1",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests", "plugins", "dataclaw/tests"]

[tool.ruff]
target-version = "py312"
extend-exclude = ["openclaw-plugins", "ui", "examples", "skill-library"]

[tool.ruff.lint]
# Correctness-only baseline (syntax errors, undefined names, invalid
# comparisons). Widen to the full pyflakes set once the existing unused
# imports are cleaned up.
select = ["E9", "F63", "F7", "F82"]
