version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      langchain:
        patterns: ["langchain*", "langgraph*"]

  - package-ecosystem: npm
    directory: /ui
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /openclaw-plugins/dataclaw
    schedule:
      interval: weekly
    ignore:
      # OpenClaw host upgrades are coordinated with the plugin SDK changes and
      # the pinned OPENCLAW_VERSION in Dockerfile.bundled; do them by hand.
      - dependency-name: openclaw

  - package-ecosystem: docker
    directories: [/]
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
