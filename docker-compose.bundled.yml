services:
  dataclaw:
    build:
      context: .
      dockerfile: Dockerfile.bundled
    # Published on the host's loopback interface only. Set
    # DATACLAW_PUBLISH_ADDR=0.0.0.0 to reach Dataclaw from other machines
    # (the API requires the access token either way).
    ports:
      - "${DATACLAW_PUBLISH_ADDR:-127.0.0.1}:${DATACLAW_PORT:-8000}:${DATACLAW_PORT:-8000}"
      - "${DATACLAW_PUBLISH_ADDR:-127.0.0.1}:${OPENCLAW_GATEWAY_PORT:-18789}:${OPENCLAW_GATEWAY_PORT:-18789}"
      - "${DATACLAW_PUBLISH_ADDR:-127.0.0.1}:${OPENCLAW_BRIDGE_PORT:-18790}:${OPENCLAW_BRIDGE_PORT:-18790}"
    volumes:
      - ${DOCKER_DATA_DIR:-./docker-data}/openclaw:/root/.openclaw
      - ${DOCKER_DATA_DIR:-./docker-data}/dataclaw:/root/.dataclaw
    environment:
      # Core ports/host — always passed. Dataclaw listens on all container
      # interfaces, so the API token is always required in this image.
      DATACLAW_HOST: ${DATACLAW_HOST:-0.0.0.0}
      DATACLAW_PORT: ${DATACLAW_PORT:-8000}
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-18789}
      OPENCLAW_BRIDGE_PORT: ${OPENCLAW_BRIDGE_PORT:-18790}
      # Runtime and utility provider are separate. Leave both unset to use the
      # saved config file.
      DATACLAW_AGENT_RUNTIME:
      DATACLAW_UTILITY_BACKEND:
      # Legacy combined override, retained for older deployments.
      DATACLAW_LLM_BACKEND:
      # Optional overrides — only passed when set on the host.
      # When unset, the entrypoint derives sensible defaults
      # (tokens default to the gateway token, API URL to loopback).
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      # Dataclaw API token, also shared with the `dataclaw` OpenClaw plugin
      # (channel + tools). Leave unset to have the entrypoint generate one and
      # keep it in ${DOCKER_DATA_DIR}/dataclaw/api-token.
      DATACLAW_TOKEN:
      # Extra browser origins / Host names allowed to use the API.
      DATACLAW_ALLOWED_ORIGINS:
      DATACLAW_ALLOWED_HOSTS:
      DATACLAW_API_URL:
      DATACLAW_OPENCLAW_URL:
      # LLM provider API keys
      ANTHROPIC_API_KEY:
      OPENAI_API_KEY:
      # Dataclaw's Gemini provider reads GOOGLE_API_KEY; OpenClaw's google
      # provider accepts either. Pass both through.
      GOOGLE_API_KEY:
      GEMINI_API_KEY:
    env_file:
      - path: .env
        required: false
    init: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
