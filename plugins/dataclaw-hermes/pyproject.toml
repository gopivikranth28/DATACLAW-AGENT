[project]
name = "dataclaw-hermes"
version = "0.1.0"
description = "Dataclaw plugin — Hermes Agent runtime bridge"
requires-python = ">=3.12"
dependencies = [
    "dataclaw",
    "httpx>=0.28",
    "pyyaml>=6.0",
]

[project.entry-points."dataclaw.plugins"]
dataclaw-hermes = "dataclaw_hermes:HermesPlugin"

[project.scripts]
dataclaw-hermes-eval = "dataclaw_hermes.eval:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=1.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist.force-include]
"../../hermes-plugins/dataclaw" = "dataclaw_hermes/extension"

[tool.hatch.build.targets.wheel.force-include]
"../../hermes-plugins/dataclaw" = "dataclaw_hermes/extension"

[tool.pytest.ini_options]
asyncio_mode = "auto"
